version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: maestria-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-admin}
      POSTGRES_DB: ${DB_NAME:-maestria_users}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: maestria-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-data: